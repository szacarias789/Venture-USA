<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="title description">
  <title id="title">Track and field athletes in motion</title>
  <desc id="description">A sprinter and a javelin thrower silhouetted above illuminated running lanes</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090521"/>
      <stop offset=".5" stop-color="#150a56"/>
      <stop offset="1" stop-color="#090e0c"/>
    </linearGradient>
    <radialGradient id="yellow-light" cx="0" cy="0" r="1" gradientTransform="translate(724 118) rotate(131) scale(420 360)">
      <stop stop-color="#fcec62" stop-opacity=".35"/>
      <stop offset=".3" stop-color="#fcec62" stop-opacity=".09"/>
      <stop offset="1" stop-color="#fcec62" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple-light" cx="0" cy="0" r="1" gradientTransform="translate(190 180) rotate(34) scale(410 350)">
      <stop stop-color="#9586ff" stop-opacity=".38"/>
      <stop offset=".4" stop-color="#5845ba" stop-opacity=".12"/>
      <stop offset="1" stop-color="#150a56" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track-surface" x1="0" y1="0" x2="1" y2=".6">
      <stop stop-color="#7d3030"/>
      <stop offset=".46" stop-color="#a64838"/>
      <stop offset="1" stop-color="#d06a42"/>
    </linearGradient>
    <linearGradient id="athlete-white" x1=".1" y1=".05" x2=".85" y2=".95">
      <stop stop-color="#fff"/>
      <stop offset=".55" stop-color="#f5f4ff"/>
      <stop offset="1" stop-color="#c9c2ff"/>
    </linearGradient>
    <linearGradient id="athlete-yellow" x1=".15" y1=".1" x2=".9" y2=".9">
      <stop stop-color="#fff7a8"/>
      <stop offset=".48" stop-color="#fcec62"/>
      <stop offset="1" stop-color="#e0bd32"/>
    </linearGradient>
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fcec62" stop-opacity="0"/>
      <stop offset="1" stop-color="#fcec62" stop-opacity=".72"/>
    </linearGradient>
    <filter id="athlete-shadow" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="line-glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame">
      <rect width="900" height="675" rx="40"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="675" fill="url(#background)"/>
    <rect width="900" height="675" fill="url(#purple-light)"/>
    <rect width="900" height="675" fill="url(#yellow-light)"/>

    <circle cx="740" cy="120" r="34" fill="#fcec62" opacity=".12" filter="url(#glow)"/>
    <circle cx="164" cy="198" r="42" fill="#9586ff" opacity=".18" filter="url(#glow)"/>

    <path d="M-50 519C188 430 531 419 950 463V730H-50Z" fill="url(#track-surface)"/>
    <path d="M-46 548C254 458 575 456 950 494" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
    <path d="M-27 588C257 500 582 496 947 528" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
    <path d="M7 629C292 545 613 540 945 563" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="3"/>
    <path d="M65 670C339 592 634 579 941 600" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>
    <path d="M-40 543C265 451 591 449 951 488" fill="none" stroke="#fcec62" stroke-opacity=".22" stroke-width="13" filter="url(#line-glow)"/>

    <g opacity=".7">
      <path d="m744 466 20 134M756 463l20 134M768 461l20 134M780 460l20 133" stroke="#fff" stroke-width="3"/>
      <path d="m744 466 38-7 3 14-39 7Zm5 28 39-7 3 14-40 7Zm5 28 40-7 3 14-40 7Zm6 28 40-7 3 14-41 7Zm5 28 41-7 3 14-41 7Z" fill="#fff" fill-opacity=".82"/>
    </g>

    <g opacity=".48">
      <path d="M81 394h207" stroke="url(#speed)" stroke-width="5" stroke-linecap="round"/>
      <path d="M26 420h222" stroke="url(#speed)" stroke-width="3" stroke-linecap="round"/>
      <path d="M118 447h133" stroke="url(#speed)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Sprinter -->
    <g filter="url(#athlete-shadow)" transform="translate(32 33) rotate(-5 390 334)">
      <circle cx="402" cy="181" r="36" fill="url(#athlete-white)"/>
      <path d="M384 218c-18 20-29 53-24 82l10 57 52-3 23-64c8-24 2-47-18-62l-16-12c-9-7-20-6-27 2Z" fill="url(#athlete-white)"/>
      <path d="m379 237-53 23-48 58c-8 10-7 23 2 30 10 8 23 6 31-4l42-52 47-17Z" fill="url(#athlete-white)"/>
      <path d="m430 244 57 19 55-34c11-7 24-4 30 7 6 10 2 23-8 29l-64 39c-6 4-13 5-20 2l-68-24Z" fill="url(#athlete-white)"/>
      <path d="m373 341-73 42-73 90c-9 11-7 27 4 35 11 9 26 7 35-4l70-84 91-45Z" fill="url(#athlete-white)"/>
      <path d="m411 339 65 35 72 102c8 12 25 15 37 6 11-8 14-24 6-35l-73-105c-3-5-8-9-13-12l-70-39Z" fill="url(#athlete-white)"/>
      <path d="m228 472-31 27c-12 11-6 30 10 32l39 3c12 1 21-9 18-20l-8-30Z" fill="#fcec62"/>
      <path d="m548 475 13 39c4 13 20 18 31 10l28-22c13-10 6-31-10-32l-41-3Z" fill="#fcec62"/>
      <path d="M369 307c19 9 42 12 67 6l-14 41-52 3Z" fill="#150a56" opacity=".88"/>
      <path d="M384 220c12 7 25 10 40 8" fill="none" stroke="#fcec62" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Javelin thrower -->
    <g filter="url(#athlete-shadow)" transform="translate(108 10) rotate(4 660 257)">
      <path d="M481 155 854 67" stroke="#fcec62" stroke-width="7" stroke-linecap="round"/>
      <path d="m852 67-30-3 7 26Z" fill="#fcec62"/>
      <circle cx="653" cy="158" r="30" fill="url(#athlete-yellow)"/>
      <path d="M621 194c-14 24-19 56-11 83l17 55 67-4 13-61c5-26-6-52-28-67l-20-14c-14-10-29-7-38 8Z" fill="url(#athlete-yellow)"/>
      <path d="m637 207-60-28-71-17c-12-3-24 5-26 17-2 11 5 22 16 25l76 18 58 34Z" fill="url(#athlete-yellow)"/>
      <path d="m679 205 57-50 51-67c7-10 21-12 30-5 9 8 11 21 4 30l-55 72-67 59Z" fill="url(#athlete-yellow)"/>
      <path d="m631 317-52 50-64 83c-8 11-6 26 5 34 10 8 25 6 33-4l61-77 80-63Z" fill="url(#athlete-yellow)"/>
      <path d="m676 320 55 52 91 60c11 8 26 5 34-6 7-11 4-26-7-33l-85-57-67-71Z" fill="url(#athlete-yellow)"/>
      <path d="m514 449-30 24c-12 10-7 29 9 31l37 4c12 1 21-9 18-20l-8-28Z" fill="#fff"/>
      <path d="m818 430 16 35c5 12 21 15 30 6l24-23c11-11 3-29-12-29l-38 1Z" fill="#fff"/>
      <path d="M612 281c25 8 55 9 89 0l-7 47-67 4Z" fill="#150a56" opacity=".9"/>
      <path d="M628 195c15 6 30 7 46 2" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    </g>

    <g fill="none" stroke-linecap="round">
      <path d="M215 138c71-43 157-59 250-42" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
      <path d="M228 158c65-35 136-46 211-33" stroke="#fcec62" stroke-opacity=".24" stroke-width="2"/>
      <path d="M742 200c54 22 93 55 119 99" stroke="#fff" stroke-opacity=".1" stroke-width="3"/>
    </g>

    <rect x="1" y="1" width="898" height="673" rx="39" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="2"/>
  </g>
</svg>
